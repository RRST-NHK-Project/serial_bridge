serial_bridge_status:
  ros__parameters:
    # スキャン対象から除外するポートのリスト
    # センサのシリアル変換モジュール等、マイコン通信と干渉するポートを指定する
    # 例: excluded_ports: ["/dev/ttyUSB0", "/dev/ttyACM1"]
    # LiDAR を載せなくなったので /dev/ttyUSB0 の除外を解除(2026-08-20)
    # 干渉するセンサを挿したら実体パス(/dev/ttyUSB*)をここに追加する
    excluded_ports: []

    # RX タイムアウト（秒）: この時間内にデータを受信しなければポートを閉じる
    rx_timeout_sec: 2.0

    # 再接続インターバル（秒）: 切断後に再接続を試みるまでの最小待機時間
    reconnect_interval_sec: 3.0

    # デバイスのスキャンインターバル（ミリ秒）: 新規デバイスを探索する間隔
    scan_interval_ms: 5000
